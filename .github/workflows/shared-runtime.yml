name: Shared runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_TEST_DSN: dbname=postgres user=postgres host=127.0.0.1 port=5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install reviewed shared core and service tests
        run: |
          python -m pip install 'platform-backend-core @ git+https://github.com/bookchaowalit-backend/platform-backend-core.git@21d5f44d26220080cbed43b9807979dc84a8533a'
          python -m pip install -e '.[test]'
      - name: Test against disposable restricted PostgreSQL roles
        run: python -m pytest -q
      - name: Build service wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
  image:
    # Proves the Dockerfile builds from a clean checkout. Nothing is pushed or deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build container image (no push)
        run: docker build --pull --tag platform-communication:ci .
      - name: Image imports the service and runs as non-root
        run: |
          docker run --rm platform-communication:ci python -c "import platform_backend_core, platform_communication.app"
          test "$(docker run --rm platform-communication:ci id -u)" != 0
