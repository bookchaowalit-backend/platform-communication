name: Shared runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    # Proves the Dockerfile builds from a clean checkout. Nothing is pushed or deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build container image (no push)
        run: docker build --pull --tag platform-communication:ci .
      - name: Image imports the service and runs as non-root
        run: |
          docker run --rm platform-communication:ci python -c "import platform_backend_core, platform_communication.app"
          test "$(docker run --rm platform-communication:ci id -u)" != 0
