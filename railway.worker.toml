# Delivery worker as a Railway cron (service `communication-worker`).
# Deploy: copy this file over railway.toml in a clean `git archive` of main, then `railway up`.
# It drains due messages for COMMUNICATION_WORKSPACE_ID and exits, so Neon can scale to zero
# between runs (an always-on 0.5 s poller would use ~182 CU-h/month, over the free 100).
[build]
builder = "DOCKERFILE"
[deploy]
startCommand = "python -m platform_communication worker --until-empty"
cronSchedule = "*/30 * * * *"
restartPolicyType = "NEVER"
